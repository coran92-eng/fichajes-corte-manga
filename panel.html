<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Cómo va el bar</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        const TOKEN = sessionStorage.getItem('adminToken') || '';
        if (TOKEN !== 'auth-token-fichaje-admin') window.location.href = 'login.html';
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a; color: #e2e8f0; min-height: 100dvh; padding: 16px;
        }
        .wrap { max-width: 900px; margin: 0 auto; }

        .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
        .top h1 { font-size: 21px; flex: 1; min-width: 160px; }
        select, button {
            font-family: inherit; font-size: 13px; font-weight: 600;
            border-radius: 8px; border: 1px solid #334155; cursor: pointer;
            background: #1e293b; color: #e2e8f0; padding: 8px 12px;
        }
        .fecha-txt { color: #64748b; font-size: 13px; margin-bottom: 18px; }

        h2 {
            font-size: 12px; text-transform: uppercase; letter-spacing: .6px;
            color: #64748b; margin: 24px 0 10px;
        }

        /* ── Atención ── */
        .aten { display: flex; flex-direction: column; gap: 8px; }
        .card-at {
            background: #1e293b; border-left: 3px solid #f59e0b; border-radius: 9px;
            padding: 12px 14px; display: flex; gap: 11px; align-items: flex-start;
        }
        .card-at.rojo { border-left-color: #ef4444; }
        .card-at.info { border-left-color: #38bdf8; }
        .card-at i { flex-shrink: 0; margin-top: 1px; color: #f59e0b; }
        .card-at.rojo i { color: #ef4444; }
        .card-at.info i { color: #38bdf8; }
        .at-txt { flex: 1; font-size: 14px; line-height: 1.45; }
        .at-txt strong { color: #f8fafc; }
        .at-sub { color: #94a3b8; font-size: 12.5px; margin-top: 3px; line-height: 1.5; }
        .todo-ok {
            background: #052e1a; border-left: 3px solid #10b981; border-radius: 9px;
            padding: 14px; font-size: 14px; color: #6ee7b7; font-weight: 600;
        }

        /* ── Semana en números ── */
        .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
        .kpi { background: #1e293b; border-radius: 10px; padding: 14px; }
        .kpi-lbl { font-size: 11.5px; color: #64748b; text-transform: uppercase; letter-spacing: .4px; }
        .kpi-val { font-size: 25px; font-weight: 800; color: #f8fafc; margin: 5px 0 2px; }
        .kpi-delta { font-size: 12px; font-weight: 700; }
        .up { color: #f87171; } .down { color: #6ee7b7; } .flat { color: #64748b; }

        /* ── Días ── */
        .dia {
            background: #1e293b; border-radius: 10px; padding: 12px 14px; margin-bottom: 7px;
            border-left: 3px solid #334155;
        }
        .dia.verde { border-left-color: #10b981; }
        .dia.ambar { border-left-color: #f59e0b; }
        .dia.rojo  { border-left-color: #ef4444; }
        .dia-cab { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
        .dia-nombre { font-weight: 700; font-size: 14.5px; color: #f8fafc; min-width: 92px; }
        .dia-horas { font-family: ui-monospace, monospace; font-size: 14px; }
        .dia-prev { color: #64748b; font-size: 12.5px; }
        .dia-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
        .tag {
            font-size: 11.5px; padding: 2px 8px; border-radius: 20px;
            background: #0f172a; color: #94a3b8; font-weight: 600;
        }
        .tag.mal { background: #450a0a; color: #fca5a5; }
        .tag.ojo { background: #451a03; color: #fcd34d; }
        .tag.bien { background: #052e1a; color: #6ee7b7; }
        .barra-h { height: 4px; background: #0f172a; border-radius: 4px; margin-top: 9px; overflow: hidden; }
        .barra-h span { display: block; height: 100%; background: #38bdf8; }

        /* ── Tabla por persona ── */
        .tabla-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .tp { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }
        .tp th {
            text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .4px;
            color: #64748b; padding: 6px 8px; border-bottom: 1px solid #334155; font-weight: 700;
        }
        .tp td { padding: 9px 8px; border-bottom: 1px solid #1e293b; vertical-align: middle; }
        .tp-nom { font-weight: 700; color: #f8fafc; white-space: nowrap; }
        .tp-num { font-family: ui-monospace, monospace; }

        /* ── Detalle de un día ── */
        .dia-cab { cursor: pointer; }
        .dia-flecha { color: #64748b; font-size: 12px; transition: transform .18s; }
        .dia-flecha.girada { transform: rotate(180deg); display: inline-block; }
        .dia-gente { display: none; margin-top: 10px; border-top: 1px solid #334155; padding-top: 8px; }
        .dia-gente.abierta { display: block; }
        .pers {
            display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
            padding: 6px 0; font-size: 12.5px;
        }
        .pers-nom { font-weight: 700; color: #e2e8f0; min-width: 88px; }
        .pers-dato { display: inline-flex; }

        .nota-pie { color: #64748b; font-size: 12px; line-height: 1.6; margin-top: 26px; }
        .cargando { color: #64748b; padding: 40px 0; text-align: center; font-size: 14px; }
        .error { background: #450a0a; color: #fca5a5; padding: 13px; border-radius: 9px; font-size: 13.5px; }

        /* ── Fotos de las tareas ── */
        .fotos-filtro { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .fotos-filtro input[type="date"] {
            font-family: inherit; font-size: 13px; border-radius: 8px; border: 1px solid #334155;
            background: #1e293b; color: #e2e8f0; padding: 7px 10px;
        }
        .fotos-filtro span { color: #64748b; font-size: 13px; }
        .fotos-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
            gap: 8px;
        }
        .foto-tile {
            aspect-ratio: 1; border-radius: 8px; border: none; padding: 0; cursor: pointer;
            background: #1e293b center/cover no-repeat; position: relative;
        }
        .foto-tile.sospechosa { box-shadow: inset 0 0 0 2px #f59e0b; }
        .foto-flag {
            position: absolute; top: 4px; right: 4px; background: #451a03; color: #fcd34d;
            font-size: 11px; border-radius: 6px; padding: 1px 5px;
        }
        .foto-modal {
            display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, .92);
            z-index: 50; padding: 20px; overflow-y: auto;
        }
        .foto-modal.abierto { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .foto-modal img { max-width: min(560px, 100%); max-height: 65dvh; border-radius: 10px; }
        .foto-modal-meta { color: #e2e8f0; font-size: 14px; line-height: 1.7; text-align: center; }
        .foto-modal-cerrar {
            align-self: flex-end; background: #1e293b; border: 1px solid #334155;
            color: #e2e8f0; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <h1>Cómo va el bar</h1>
        <select id="selCentro"></select>
        <button id="btnRecargar">↻</button>
        <button id="btnDetalle">Ver detalle</button>
    </div>
    <div class="fecha-txt" id="fechaTxt"></div>

    <div id="contenido"><div class="cargando">Cargando los últimos 7 días…</div></div>

    <h2>Fotos de las tareas</h2>
    <div class="fotos-filtro">
        <input type="date" id="fotoDesde">
        <span>a</span>
        <input type="date" id="fotoHasta">
        <button id="btnFotos">Ver</button>
    </div>
    <div id="fotosCont"><div class="cargando">Cargando fotos…</div></div>
</div>

<div class="foto-modal" id="fotoModal">
    <button type="button" class="foto-modal-cerrar" id="fotoModalCerrar">Cerrar ✕</button>
    <img alt="Foto de la tarea">
    <div class="foto-modal-meta"></div>
</div>

<script>
const H = { 'X-Auth-Token': TOKEN };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const DIA_MS = 86400000;
const CORTE = 7;                  // la jornada del bar va de 07:00 a 07:00
const MARGEN_TARDE = 5;           // minutos de cortesía en la entrada
let centro = '';

const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

/** Inicio (ms) de la jornada operativa que contiene este instante. */
function inicioJornadaDe(ts) {
    const d = new Date(ts);
    const ini = new Date(d);
    ini.setHours(CORTE, 0, 0, 0);
    if (d.getHours() < CORTE) ini.setDate(ini.getDate() - 1);
    return ini.getTime();
}
const fechaOperativaDe = ts => iso(new Date(inicioJornadaDe(ts)));

function minutosDeHHMM(h) {
    const m = /^(\d{1,2}):(\d{2})/.exec(String(h || '').trim());
    if (!m) return null;
    const a = +m[1], b = +m[2];
    return a > 23 || b > 59 ? null : a * 60 + b;
}
function difMin(a, b) {
    if (a === null || b === null) return null;
    let d = a - b;
    if (d > 720) d -= 1440;
    if (d < -720) d += 1440;
    return d;
}
const horas = m => Math.round(m / 6) / 10;   // minutos → horas con un decimal
const fmtH = h => `${String(h).replace('.', ',')} h`;

/** Minutos realmente trabajados, descontando descansos. Un turno sin cerrar
 *  no suma: inventarle una salida falsearía las horas. */
function minutosTrabajados(eventos) {
    let ent = null, desc = null, restar = 0, total = 0, abierto = false;
    for (const f of eventos) {
        const ts = Number(f.timestamp);
        if (f.tipo === 'entrada') { ent = ts; desc = null; restar = 0; }
        else if (f.tipo === 'inicio_descanso') { if (ent !== null) desc = ts; }
        else if (f.tipo === 'fin_descanso') { if (desc !== null) { restar += ts - desc; desc = null; } }
        else if (f.tipo === 'salida' && ent !== null) {
            if (desc !== null) { restar += ts - desc; desc = null; }
            total += Math.max(0, (ts - ent - restar) / 60000);
            ent = null; restar = 0;
        }
    }
    if (ent !== null) abierto = true;
    return { minutos: total, abierto };
}

/**
 * Devuelve {datos, fallo}. Un mensaje de error que no dice qué ha fallado
 * obliga a adivinar, y aquí ya hemos perdido demasiadas rondas adivinando.
 */
async function pedir(url, ms = 20000) {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), ms);
    const t0 = Date.now();
    try {
        const r = await fetch(url, { headers: H, signal: c.signal, cache: 'no-store' });
        clearTimeout(t);
        const tardo = Date.now() - t0;
        const servidor = r.headers.get('X-Ms-Total');
        if (!r.ok) return { datos: null, fallo: `HTTP ${r.status}`, tardo, servidor };
        return { datos: await r.json(), fallo: '', tardo, servidor };
    } catch (e) {
        clearTimeout(t);
        return {
            datos: null, tardo: Date.now() - t0, servidor: null,
            fallo: e?.name === 'AbortError' ? `sin respuesta en ${ms / 1000}s` : 'sin conexión',
        };
    }
}

const ms = r => r ? `${(r.tardo / 1000).toFixed(1)}s${r.servidor ? ` (servidor ${r.servidor}ms)` : ''}` : '—';

async function cargarCentros() {
    let centros = ['Corte de Manga'];
    try {
        const r = await fetch('/config.json');
        if (r.ok) { const c = await r.json(); if (Array.isArray(c.centros) && c.centros.length) centros = c.centros; }
    } catch {}
    const sel = document.getElementById('selCentro');
    sel.innerHTML = centros.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    centro = new URLSearchParams(location.search).get('centro') || centros[0];
    if (centros.includes(centro)) sel.value = centro; else centro = sel.value;
}

async function cargar() {
    const cont = document.getElementById('contenido');
    cont.innerHTML = '<div class="cargando">Cargando los últimos 7 días…</div>';

    const ahora = Date.now();
    const iniHoy = inicioJornadaDe(ahora);
    // 14 días: 7 para mostrar y 7 más para comparar con la semana anterior.
    const desde = iniHoy - 13 * DIA_MS;
    const ayer = fechaOperativaDe(iniHoy - DIA_MS);

    // Una sola llamada, ya cruzada con el cuadrante y agregada en el servidor.
    // Antes se bajaban miles de filas para cruzarlas aquí, y eso es justo lo
    // que no respondía: una fila tardaba 185 ms y varios miles no llegaban.
    const rPanel = await pedir(
        `/api/fichajes?resumen=panel&centro=${encodeURIComponent(centro)}&desde=${desde}&hasta=${ahora + 60000}`);

    if (!rPanel.datos) {
        cont.innerHTML = `<div class="error">
            <strong>No se han podido leer los fichajes</strong> (${esc(rPanel.fallo)}, ${esc(ms(rPanel))}).<br>
            Sin ellos no hay horas que resumir.
            <div style="margin-top:10px"><button id="btnReint">Reintentar</button></div>
            <div id="sonda" style="margin-top:10px;font-weight:400;font-size:12.5px;opacity:.85">Comprobando el servidor…</div>
        </div>`;
        document.getElementById('btnReint').addEventListener('click', cargar);
        sondear(desde, ahora);
        return;
    }

    const [rNotas, rTareas] = await Promise.all([
        pedir(`/api/turno-notas?centro=${encodeURIComponent(centro)}&dias=7`),
        pedir(`/api/tareas?centro=${encodeURIComponent(centro)}&fecha_operativa=${ayer}`),
    ]);

    const avisos = [];
    if (!rNotas.datos) avisos.push(`las notas e incidencias (${rNotas.fallo})`);
    if (!rTareas.datos) avisos.push(`las tareas (${rTareas.fallo})`);

    pintar(construir(rPanel.datos, rNotas.datos, rTareas.datos, iniHoy), avisos, {
        panel: ms(rPanel), notas: ms(rNotas), tareas: ms(rTareas),
        filas: rPanel.datos.marcas_leidas,
    });

    document.getElementById('fechaTxt').textContent =
        `${centro} · jornada del ${new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(iniHoy))}`;
}

function construir(panel, notas, tareasAyer, iniHoy) {
    const porFecha = {};
    for (const d of (panel.dias || [])) porFecha[d.fecha] = d.personas || [];
    const previsto = panel.previsto_dia || {};

    const resumen = (fecha, ts, esHoy) => {
        const gentes = porFecha[fecha] || [];
        let minutos = 0, personas = 0, tarde = 0, conPrevisto = 0, sinCerrar = 0;
        for (const g of gentes) {
            if (g.abierto) sinCerrar++;
            if (g.minutos <= 0 && !g.abierto && !g.entrada) continue;
            personas++;
            minutos += g.minutos;
            if (g.difEnt !== null && g.difEnt !== undefined) {
                conPrevisto++;
                if (g.difEnt > MARGEN_TARDE) tarde++;
            }
        }
        return {
            fecha, ts, esHoy, personas, minutos,
            minPrev: previsto[fecha] || 0,
            tarde, conPrevisto, sinCerrar, gentes,
        };
    };

    const dias = [], previos = [];
    for (let i = 6; i >= 0; i--) {
        const ts = iniHoy - i * DIA_MS;
        dias.push(resumen(iso(new Date(ts)), ts, i === 0));
    }
    for (let i = 13; i >= 7; i--) {
        const ts = iniHoy - i * DIA_MS;
        previos.push(resumen(iso(new Date(ts)), ts, false));
    }

    // Turnos abiertos de días pasados: alguien que no fichó la salida.
    const hoyFecha = iso(new Date(iniHoy));
    const abiertos = [];
    for (const [fecha, gentes] of Object.entries(porFecha)) {
        if (fecha >= hoyFecha) continue;
        for (const g of gentes) {
            if (g.abierto) abiertos.push({ nombre: g.nombre, fecha, desde: g.entrada || '—' });
        }
    }

    return {
        dias, previos, abiertos,
        motivos: (panel.motivos || []).map(m => ({ empleado: m.empleado, fecha: m.fecha, tipo: m.tipo, motivo: m.motivo })),
        dispositivosCompartidos: panel.dispositivos_compartidos || [],
        incidencias: (notas?.incidencias || []).filter(n => n.estado === 'abierta' || n.estado === 'en_curso'),
        faltas: (notas?.faltas || []).filter(n => n.estado === 'abierta' || n.estado === 'en_curso'),
        tareasAyer,
    };
}

/**
 * Cuando los fichajes fallan, hay que saber si el endpoint está caído o si lo
 * lento es esta consulta en concreto. Se prueba lo más pequeño posible y luego
 * se va subiendo el rango.
 */
async function sondear(desde, ahora) {
    const caja = document.getElementById('sonda');
    if (!caja) return;
    const pruebas = [
        ['1 registro', `/api/fichajes?limit=1`],
        ['resumen de 1 día', `/api/fichajes?resumen=panel&centro=${encodeURIComponent(centro)}&desde=${ahora - DIA_MS}&hasta=${ahora + 60000}`],
        ['resumen de 14 días', `/api/fichajes?resumen=panel&centro=${encodeURIComponent(centro)}&desde=${desde}&hasta=${ahora + 60000}`],
    ];
    const lineas = [];
    for (const [nombre, url] of pruebas) {
        const r = await pedir(url, 25000);
        const cuantas = !r.datos ? null
            : Array.isArray(r.datos) ? `${r.datos.length} filas`
            : `${r.datos.marcas_leidas ?? '?'} marcas`;
        lineas.push(`· ${nombre}: ${r.datos ? `${cuantas} en ${ms(r)}` : `falló (${r.fallo})`}`);
        caja.innerHTML = lineas.join('<br>');
    }
}

function pintar(d, avisos = [], tiempos = null) {
    const cont = document.getElementById('contenido');
    const avisoFuentes = avisos.length
        ? `<div class="error" style="margin-bottom:12px">No se ha podido leer ${esc(avisos.join(' ni '))}.
           Lo demás sí está actualizado.</div>`
        : '';

    // ── Atención ──
    const at = [];
    if (d.incidencias.length) {
        at.push(tarjeta('rojo', 'alert-triangle',
            `<strong>${d.incidencias.length} incidencia${d.incidencias.length !== 1 ? 's' : ''} sin resolver</strong>`,
            d.incidencias.slice(0, 4).map(n => `· ${esc(n.texto)} <em>(${esc(n.autor || '—')}, ${esc(n.fecha_operativa)})</em>`).join('<br>')));
    }
    if (d.faltas.length) {
        at.push(tarjeta('', 'package-x',
            `<strong>${d.faltas.length} cosa${d.faltas.length !== 1 ? 's' : ''} que se han acabado</strong>`,
            d.faltas.slice(0, 5).map(n => `· ${esc(n.texto)}`).join('<br>')));
    }
    if (d.abiertos.length) {
        at.push(tarjeta('rojo', 'log-out',
            `<strong>${d.abiertos.length} turno${d.abiertos.length !== 1 ? 's' : ''} sin cerrar</strong>`,
            d.abiertos.map(a => `· ${esc(a.nombre)} entró el ${esc(a.fecha)} a las ${esc(String(a.desde).slice(0, 5))} y no fichó salida`).join('<br>')
            + '<br><em>Se arregla en ⋯ → Arreglar fichajes</em>'));
    }
    const rAyer = d.tareasAyer?.resumen;
    if (rAyer && rAyer.bloqueantes_pendientes > 0) {
        const n = rAyer.bloqueantes_pendientes;
        at.push(tarjeta('rojo', 'clipboard-x',
            `<strong>${n} tarea${n !== 1 ? 's' : ''} bloqueante${n !== 1 ? 's' : ''} sin hacer ayer</strong>`,
            'Son las que no deberían quedarse nunca sin completar.'));
    }
    if (d.motivos.length) {
        at.push(tarjeta('info', 'message-square',
            `<strong>Fichajes fuera de hora, con su explicación</strong>`,
            d.motivos.map(m => `· <strong>${esc(m.empleado)}</strong> · ${m.tipo === 'entrada' ? 'entrada' : 'salida'} ${esc(m.fecha)}: ${esc(m.motivo)}`).join('<br>')
            + '<br><em>Solo lo ves tú: esto no sale en el parte del turno.</em>'));
    }
    if (d.dispositivosCompartidos.length) {
        at.push(tarjeta('rojo', 'smartphone',
            `<strong>Un mismo móvil ha fichado como más de una persona</strong>`,
            d.dispositivosCompartidos.map(c => `· ${c.personas.map(esc).join(' y ')}`).join('<br>')
            + '<br><em>Puede que alguien le haya dejado el móvil a un compañero, o le haya pedido que cerrara su sesión para fichar él.</em>'));
    }

    // ── Semana ──
    const suma = arr => arr.reduce((a, x) => a + x.minutos, 0);
    const sumaPrev = arr => arr.reduce((a, x) => a + x.minPrev, 0);
    const hSem = suma(d.dias), hAnt = suma(d.previos);
    const pSem = sumaPrev(d.dias);
    const tardeSem = d.dias.reduce((a, x) => a + x.tarde, 0);
    const conPrev = d.dias.reduce((a, x) => a + x.conPrevisto, 0);
    const puntual = conPrev ? Math.round((conPrev - tardeSem) / conPrev * 100) : null;

    const tardeAnt = d.previos.reduce((a, x) => a + x.tarde, 0);
    const conPrevAnt = d.previos.reduce((a, x) => a + x.conPrevisto, 0);
    const puntualAnt = conPrevAnt ? Math.round((conPrevAnt - tardeAnt) / conPrevAnt * 100) : null;

    const kpis = `
        <div class="kpis">
            ${kpi('Horas trabajadas', fmtH(horas(hSem)), delta(hSem, hAnt, 'h'))}
            ${kpi('Frente al cuadrante', pSem ? fmtH(horas(pSem)) : '—',
                  pSem ? deltaTxt(horas(hSem - pSem), 'h', hSem > pSem) : '<span class="flat">sin cuadrante</span>')}
            ${kpi('Puntualidad', puntual === null ? '—' : `${puntual}%`,
                  puntual === null || puntualAnt === null ? '<span class="flat">—</span>'
                  : deltaTxt(puntual - puntualAnt, ' pts', puntual < puntualAnt))}
            ${kpi('Incidencias abiertas', String(d.incidencias.length),
                  d.faltas.length ? `<span class="flat">+ ${d.faltas.length} sin género</span>` : '<span class="flat">—</span>')}
            ${kpi('Tareas de ayer', rAyer && rAyer.total ? `${rAyer.completadas}/${rAyer.total}` : '—',
                  rAyer && rAyer.total
                    ? (rAyer.completadas === rAyer.total
                        ? '<span class="down">completadas</span>'
                        : `<span class="up">${rAyer.total - rAyer.completadas} sin hacer</span>`)
                    : '<span class="flat">sin tareas</span>')}
        </div>`;

    // ── Cada persona en los 7 días ──
    const porPersona = {};
    for (const dia of d.dias) {
        for (const g of dia.gentes) {
            const k = g.nombre.trim().toUpperCase();
            const p = (porPersona[k] ||= {
                nombre: g.nombre, dias: 0, minutos: 0,
                tarde: 0, minTarde: 0, puntual: 0,
                antes: 0, deMas: 0, conDescanso: 0, sinDescanso: 0, sinCerrar: 0,
            });
            p.dias++;
            p.minutos += g.minutos;
            if (g.abierto) p.sinCerrar++;
            if (g.difEnt !== null) {
                if (g.difEnt > MARGEN_TARDE) { p.tarde++; p.minTarde += g.difEnt; }
                else p.puntual++;
            }
            if (g.difSal !== null) {
                if (g.difSal < -MARGEN_TARDE) p.antes++;
                else if (g.difSal > 15) p.deMas++;
            }
            if (g.descansos.length) p.conDescanso++; else p.sinDescanso++;
        }
    }
    const personas = Object.values(porPersona)
        .sort((a, b) => b.tarde - a.tarde || b.minutos - a.minutos);

    const tablaPersonas = personas.length ? `
        <div class="tabla-wrap"><table class="tp">
            <thead><tr>
                <th>Persona</th><th>Días</th><th>Horas</th>
                <th>Entrada</th><th>Salida</th><th>Descanso</th>
            </tr></thead>
            <tbody>${personas.map(p => `
                <tr>
                    <td class="tp-nom">${esc(p.nombre)}</td>
                    <td>${p.dias}</td>
                    <td class="tp-num">${fmtH(horas(p.minutos))}</td>
                    <td>${p.tarde
                        ? `<span class="tag ${p.tarde > 2 ? 'mal' : 'ojo'}">${p.tarde} tarde · +${Math.round(p.minTarde)} min</span>`
                        : p.puntual ? '<span class="tag bien">puntual</span>' : '<span class="tag">sin horario</span>'}</td>
                    <td>${p.antes || p.deMas
                        ? [p.antes ? `<span class="tag ojo">${p.antes} antes</span>` : '',
                           p.deMas ? `<span class="tag">${p.deMas} de más</span>` : ''].join(' ')
                        : '<span class="tag bien">a su hora</span>'}</td>
                    <td>${p.conDescanso
                        ? `<span class="tag ${p.sinDescanso ? '' : 'bien'}">${p.conDescanso} de ${p.dias}</span>`
                        : `<span class="tag ojo">ninguno</span>`}</td>
                </tr>`).join('')}</tbody>
        </table></div>` : '<div class="todo-ok" style="background:#1e293b;color:#94a3b8;border-left-color:#334155">Nadie ha fichado en los últimos 7 días.</div>';

    // ── Días ──
    const maxMin = Math.max(1, ...d.dias.map(x => Math.max(x.minutos, x.minPrev)));
    const filas = d.dias.slice().reverse().map(x => {
        const nom = new Intl.DateTimeFormat('es-ES', { weekday: 'short', day: '2-digit', month: '2-digit' })
            .format(new Date(x.ts));
        const desvio = x.minPrev ? Math.round((x.minutos - x.minPrev) / x.minPrev * 100) : null;
        const color = x.sinCerrar ? 'rojo'
            : (x.conPrevisto && x.tarde / x.conPrevisto > 0.25) || (desvio !== null && Math.abs(desvio) > 15) ? 'ambar'
            : x.personas ? 'verde' : '';

        const tags = [];
        if (x.personas) tags.push(`<span class="tag">${x.personas} persona${x.personas !== 1 ? 's' : ''}</span>`);
        if (x.conPrevisto) tags.push(x.tarde
            ? `<span class="tag ${x.tarde / x.conPrevisto > 0.25 ? 'mal' : 'ojo'}">${x.tarde} tarde</span>`
            : `<span class="tag bien">todos puntuales</span>`);
        if (desvio !== null && Math.abs(desvio) > 5)
            tags.push(`<span class="tag ${Math.abs(desvio) > 15 ? 'ojo' : ''}">${desvio > 0 ? '+' : ''}${desvio}% vs cuadrante</span>`);
        if (x.sinCerrar) tags.push(`<span class="tag mal">${x.sinCerrar} sin cerrar</span>`);
        if (!x.personas) tags.push('<span class="tag">sin actividad</span>');

        const gente = x.gentes.map(g => `
            <div class="pers">
                <span class="pers-nom">${esc(g.nombre)}</span>
                <span class="pers-dato">${marcaHora('E', g.prevEntrada, g.entrada, g.difEnt, MARGEN_TARDE)}</span>
                <span class="pers-dato">${marcaHora('S', g.prevSalida, g.salida, g.difSal, 15)}</span>
                <span class="pers-dato">${g.descansoAbierto
                    ? '<span class="tag ojo">descanso sin cerrar</span>'
                    : g.descansos.length
                        ? `<span class="tag">descanso ${g.descansoMin} min</span>`
                        : '<span class="tag ojo">sin descanso</span>'}</span>
                <span class="pers-dato">${g.abierto ? '<span class="tag mal">sin cerrar</span>' : fmtH(horas(g.minutos))}</span>
            </div>`).join('');

        return `
        <div class="dia ${color}">
            <div class="dia-cab" data-dia="${x.fecha}" role="button" tabindex="0">
                <span class="dia-nombre">${nom}${x.esHoy ? ' · hoy' : ''}</span>
                <span class="dia-horas">${fmtH(horas(x.minutos))}</span>
                ${x.minPrev ? `<span class="dia-prev">previsto ${fmtH(horas(x.minPrev))}</span>` : ''}
                ${x.gentes.length ? '<span class="dia-flecha">▾</span>' : ''}
            </div>
            <div class="dia-tags">${tags.join('')}</div>
            <div class="barra-h"><span style="width:${Math.round(x.minutos / maxMin * 100)}%"></span></div>
            ${gente ? `<div class="dia-gente" id="g-${x.fecha}">${gente}</div>` : ''}
        </div>`;
    }).join('');

    cont.innerHTML = `
        ${avisoFuentes}
        <h2>Lo que necesita tu atención</h2>
        <div class="aten">${at.length ? at.join('') : '<div class="todo-ok">✓ Nada pendiente. Todo en orden.</div>'}</div>

        <h2>Los últimos 7 días</h2>
        ${kpis}

        <h2>Cada persona, estos 7 días</h2>
        ${tablaPersonas}

        <h2>Día a día <span style="text-transform:none;letter-spacing:0">(toca un día para ver quién hizo qué)</span></h2>
        ${filas}

        ${tiempos ? `<p class="nota-pie" style="opacity:.7">
            ${tiempos.filas} marcas leídas · resumen ${tiempos.panel} ·
            notas ${tiempos.notas} · tareas ${tiempos.tareas}
        </p>` : ''}

        <p class="nota-pie">
            La jornada va de 07:00 a 07:00, así que un turno de noche cuenta en el día que empezó.
            Las horas salen de los fichajes reales, descontando descansos; un turno sin cerrar no suma
            hasta que se corrige. La puntualidad solo se mide en quien tenía horario en el cuadrante.
        </p>`;

    cont.querySelectorAll('[data-dia]').forEach(cab => {
        const abrir = () => {
            const caja = document.getElementById(`g-${cab.dataset.dia}`);
            if (caja) caja.classList.toggle('abierta');
            cab.querySelector('.dia-flecha')?.classList.toggle('girada');
        };
        cab.addEventListener('click', abrir);
        cab.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(); } });
    });

    if (typeof lucide !== 'undefined') lucide.createIcons();
}

/** "19:00 → 19:04  +4" con el color según se pase o no de la tolerancia. */
function marcaHora(letra, prev, real, dif, tolerancia) {
    if (!prev && !real) return `<span class="tag">${letra} —</span>`;
    const cuerpo = prev && real ? `${prev}→${real}` : (real || `${prev}→—`);
    if (dif === null || dif === undefined) return `<span class="tag">${letra} ${cuerpo}</span>`;
    const fuera = Math.abs(dif) > tolerancia;
    const signo = dif > 0 ? '+' : '';
    return `<span class="tag ${fuera ? (dif > 0 ? 'ojo' : 'mal') : 'bien'}">${letra} ${cuerpo} ${signo}${dif}</span>`;
}

function tarjeta(clase, icono, titulo, sub) {
    return `<div class="card-at ${clase}">
        <i data-lucide="${icono}" style="width:18px;height:18px"></i>
        <div class="at-txt">${titulo}${sub ? `<div class="at-sub">${sub}</div>` : ''}</div>
    </div>`;
}
function kpi(lbl, val, extra) {
    return `<div class="kpi"><div class="kpi-lbl">${lbl}</div><div class="kpi-val">${val}</div><div class="kpi-delta">${extra}</div></div>`;
}
function deltaTxt(n, unidad, malo) {
    if (!n) return '<span class="flat">igual que antes</span>';
    const cls = malo ? 'up' : 'down';
    const signo = n > 0 ? '+' : '';
    return `<span class="${cls}">${signo}${String(n).replace('.', ',')}${unidad}</span>`;
}
function delta(actual, anterior, unidad) {
    if (!anterior) return '<span class="flat">sin comparación</span>';
    const dif = horas(actual - anterior);
    if (!dif) return '<span class="flat">igual que la semana pasada</span>';
    return `<span class="${dif > 0 ? 'up' : 'down'}">${dif > 0 ? '+' : ''}${String(dif).replace('.', ',')}${unidad} vs semana pasada</span>`;
}

// ── Fotos de las tareas ────────────────────────────────────────
// La lista trae solo metadatos; cada imagen se pide aparte y solo cuando la
// miniatura entra en pantalla, para no bajar de golpe todas las fotos del rango.
const cacheFotos = new Map(); // id de evidencia → URL de objeto ya descargada

async function urlDeFoto(id) {
    if (cacheFotos.has(id)) return cacheFotos.get(id);
    const r = await fetch(`/api/tareas?recurso=evidencia&id=${id}`, { headers: H, cache: 'no-store' });
    if (!r.ok) return null;
    const url = URL.createObjectURL(await r.blob());
    cacheFotos.set(id, url);
    return url;
}

const observadorFotos = new IntersectionObserver((entradas, obs) => {
    for (const entrada of entradas) {
        if (!entrada.isIntersecting) continue;
        obs.unobserve(entrada.target);
        urlDeFoto(Number(entrada.target.dataset.id))
            .then(url => { if (url) entrada.target.style.backgroundImage = `url(${url})`; });
    }
}, { rootMargin: '200px' });

async function abrirFoto(f) {
    const modal = document.getElementById('fotoModal');
    const verificada = f.origen_captura === 'camara_en_local' || f.origen_captura === 'ipad_local';
    modal.querySelector('.foto-modal-meta').innerHTML = `
        <strong>${esc(f.tarea)}</strong><br>
        ${esc(f.empleado || '—')} · ${esc(f.fecha_operativa)}
        · ${new Date(f.ts_servidor).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}<br>
        ${verificada
            ? '<span class="tag bien">hecha en el bar</span>'
            : '<span class="tag ojo">sin verificar con el código</span>'}`;
    modal.querySelector('img').src = '';
    modal.classList.add('abierto');
    const url = await urlDeFoto(f.id);
    if (url) modal.querySelector('img').src = url;
}

async function cargarFotos() {
    const cont = document.getElementById('fotosCont');
    const desde = document.getElementById('fotoDesde').value;
    const hasta = document.getElementById('fotoHasta').value;
    if (!desde) return;
    cont.innerHTML = '<div class="cargando">Cargando fotos…</div>';

    const r = await pedir(`/api/tareas?recurso=evidencias&centro=${encodeURIComponent(centro)}&desde=${desde}&hasta=${hasta || desde}`);
    if (!r.datos) {
        cont.innerHTML = `<div class="error">No se han podido leer las fotos (${esc(r.fallo)}).</div>`;
        return;
    }
    const fotos = r.datos.evidencias || [];
    if (!fotos.length) {
        cont.innerHTML = '<div class="todo-ok" style="background:#1e293b;color:#94a3b8;border-left-color:#334155">Ninguna foto en ese rango.</div>';
        return;
    }

    cont.innerHTML = `<div class="fotos-grid">${fotos.map(f => `
        <button type="button" class="foto-tile${f.sospechosa ? ' sospechosa' : ''}" data-id="${f.id}"
                title="${esc(f.tarea)} · ${esc(f.empleado || '—')} · ${esc(f.fecha_operativa)}">
            ${f.sospechosa ? '<span class="foto-flag">sin verificar</span>' : ''}
        </button>`).join('')}</div>`;

    cont.querySelectorAll('.foto-tile').forEach(tile => {
        observadorFotos.observe(tile);
        const f = fotos.find(x => x.id === Number(tile.dataset.id));
        tile.addEventListener('click', () => abrirFoto(f));
    });
}

document.addEventListener('DOMContentLoaded', async () => {
    if (typeof lucide !== 'undefined') lucide.createIcons();
    document.getElementById('btnRecargar').addEventListener('click', () => { cargar(); cargarFotos(); });
    document.getElementById('btnDetalle').addEventListener('click', () => { window.location.href = 'admin.html'; });
    document.getElementById('selCentro').addEventListener('change', e => { centro = e.target.value; cargar(); cargarFotos(); });
    document.getElementById('btnFotos').addEventListener('click', cargarFotos);
    document.getElementById('fotoModalCerrar').addEventListener('click', () => {
        document.getElementById('fotoModal').classList.remove('abierto');
    });

    await cargarCentros();

    const hoy = inicioJornadaDe(Date.now());
    document.getElementById('fotoDesde').value = iso(new Date(hoy - 6 * DIA_MS));
    document.getElementById('fotoHasta').value = iso(new Date(hoy));

    cargar();
    cargarFotos();
});
</script>
