<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Horario de Turno - Fichaje</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // Auth check — encargado token O admin token (el dueño también puede acceder)
        const _enc = sessionStorage.getItem('encargadoToken') === 'auth-token-fichaje-encargado';
        const _adm = sessionStorage.getItem('adminToken') === 'auth-token-fichaje-admin';
        if (!_enc && !_adm) {
            window.location.href = 'login-encargado.html';
        }
        // Modo oscuro
        const prefiereOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (prefiereOscuro) {
            document.body.style.background = '#1f2937';
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100dvh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: #1f2937;
            font-size: 28px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .header-buttons button {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-volver {
            background: #6b7280;
            color: white;
        }

        .btn-volver:hover {
            background: #4b5563;
        }

        .btn-logout {
            background: #8b5cf6;
            color: white;
        }

        .btn-logout:hover {
            background: #7c3aed;
        }

        .btn-enviar {
            background: #2563eb;
            color: white;
        }

        .btn-enviar:hover {
            background: #1d4ed8;
        }

        .btn-enviar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Selectores de filtro */
        .filtros {
            background: #f9fafb;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: flex;
            gap: 20px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .filtro-grupo {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 200px;
        }

        .filtro-grupo label {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
        }

        .filtro-grupo select {
            padding: 10px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: white;
            color: #1f2937;
        }

        .filtro-grupo select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Info de semana */
        .semana-info {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
        }

        /* Badge de estado */
        .estado-semana {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .estado-semana.pendiente {
            background: #fef3c7;
            color: #92400e;
        }

        .estado-semana.validado {
            background: #d1fae5;
            color: #065f46;
        }

        .estado-semana.rechazado {
            background: #fee2e2;
            color: #7f1d1d;
        }

        /* Wrapper de la tabla */
        .horario-grid-wrapper {
            overflow-x: auto;
            margin-bottom: 24px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }

        /* Grid/tabla de horario */
        .horario-grid {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        .horario-grid thead {
            background: #f3f4f6;
        }

        .horario-grid th {
            padding: 12px 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
            white-space: nowrap;
        }

        .horario-grid th.col-empleado {
            text-align: left;
            padding-left: 16px;
            min-width: 150px;
        }

        .horario-grid td {
            padding: 8px 6px;
            border-bottom: 1px solid #e5e7eb;
            vertical-align: top;
        }

        .horario-grid td.td-empleado {
            padding-left: 16px;
            font-weight: 600;
            font-size: 14px;
            color: #1f2937;
            vertical-align: middle;
            white-space: nowrap;
        }

        .horario-grid tbody tr:hover {
            background: #f9fafb;
        }

        /* Celda de horario por día */
        .horario-cell {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
            min-width: 108px;
        }

        .horario-cell input[type="time"] {
            width: 92px;
            padding: 5px 7px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            text-align: center;
            background: white;
            color: #1f2937;
            transition: border-color 0.2s;
        }

        .horario-cell input[type="time"]:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        .horario-cell.es-libre {
            background: #f3f4f6;
            border-radius: 6px;
        }

        .horario-cell.es-libre input[type="time"],
        .horario-cell.es-libre .turno-dur,
        .horario-cell.es-libre .turno-bar {
            display: none;
        }

        /* Duración del turno */
        .turno-dur {
            font-size: 11px;
            font-weight: 700;
            color: #374151;
            font-variant-numeric: tabular-nums;
        }

        /* Total semanal por empleado (última columna) */
        .horario-grid th.col-total,
        .horario-grid td.td-total-sem {
            text-align: right;
            padding-right: 14px;
            min-width: 84px;
            border-left: 1px solid #e5e7eb;
            background: #f9fafb;
            vertical-align: middle;
        }
        .turno-total-sem {
            font-size: 15px;
            font-weight: 700;
            color: #1f2937;
            font-variant-numeric: tabular-nums;
        }

        /* Barra visual sobre la franja operativa (07:30 → 03:00) */
        .turno-bar {
            width: 96px;
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }
        .turno-bar-fill {
            position: absolute;
            top: 0;
            bottom: 0;
            background: #9ca3af; /* fallback; JS pinta el color según rol */
            border-radius: 3px;
        }
        /* Coloreado por rol del empleado — fallback si JS aún no pintó */
        tr.rol-cocina    .turno-bar-fill--1 { background: #f97316; }
        tr.rol-sala      .turno-bar-fill--1 { background: #3b82f6; }
        tr.rol-mixto     .turno-bar-fill--1 { background: #a855f7; }
        tr.rol-barra     .turno-bar-fill--1 { background: #a21caf; }
        tr.rol-limpieza  .turno-bar-fill--1 { background: #14b8a6; }
        tr.rol-encargado .turno-bar-fill--1 { background: #eab308; }
        tr.rol-extra     .turno-bar-fill--1 { background: #ff42a1; }
        tr.rol-extra     .td-empleado { border-left: 4px solid #ff42a1; }
        tr.rol-barra     .td-empleado { border-left: 4px solid #a21caf; }
        tr.rol-limpieza  .td-empleado { border-left: 4px solid #14b8a6; }
        tr.rol-encargado .td-empleado { border-left: 4px solid #eab308; }

        /* Selector "rol de este día" (primera parte del turno) */
        .rol1-row {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #6b7280;
        }
        .rol1-lbl { font-weight: 600; }
        .rol1-row .sel-rol1 {
            padding: 2px 4px;
            font-size: 12px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            background: white;
            color: #1f2937;
            cursor: pointer;
        }

        /* Resumen semanal (Gantt) */
        .resumen-semana { margin-top: 8px; margin-bottom: 16px; }
        .resumen-titulo {
            font-size: 16px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 10px;
        }
        .gantt-day {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            background: #fafafa;
        }
        .gantt-day-title {
            font-size: 13px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 8px;
        }
        .gantt-axis {
            position: relative;
            height: 14px;
            margin-left: 90px;
            border-bottom: 1px dashed #d1d5db;
            font-size: 10px;
            color: #6b7280;
            font-variant-numeric: tabular-nums;
        }
        .gantt-axis span {
            position: absolute;
            transform: translateX(-50%);
            top: 0;
        }
        .gantt-row {
            display: flex;
            align-items: center;
            margin-top: 6px;
        }
        .gantt-label {
            width: 90px;
            font-size: 12px;
            color: #374151;
            font-weight: 600;
            padding-right: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .gantt-track {
            position: relative;
            flex: 1;
            height: 14px;
            background:
                repeating-linear-gradient(to right,
                  transparent 0, transparent calc(100%/19.5 - 1px),
                  #e5e7eb    calc(100%/19.5 - 1px), #e5e7eb    calc(100%/19.5));
            border-radius: 3px;
            overflow: hidden;
        }
        .gantt-seg {
            position: absolute;
            top: 1px;
            bottom: 1px;
            border-radius: 2px;
        }
        .gantt-empty {
            color: #9ca3af;
            font-size: 12px;
            padding: 4px 0;
        }

        /* Marca del descanso planificado en la barra */
        .turno-bar-desc {
            position: absolute;
            top: -2px;
            bottom: -2px;
            min-width: 3px;
            background: #111827;
            border-radius: 1px;
            outline: 1px solid rgba(255,255,255,0.6);
        }

        /* Importación del horario desde Excel */
        .import-cab {
            display: flex; justify-content: space-between; align-items: flex-start;
            gap: 16px; flex-wrap: wrap; margin-bottom: 12px;
        }
        .import-titulo { font-size: 18px; color: #1f2937; }
        .import-sub { font-size: 13px; color: #6b7280; margin-top: 3px; }
        .import-acciones { display: flex; gap: 8px; }
        .tabla-import-wrapper { overflow-x: auto; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 20px; }
        table.tabla-import { width: 100%; border-collapse: collapse; font-size: 13px; }
        table.tabla-import th {
            background: #f3f4f6; padding: 9px 10px; text-align: left;
            font-size: 12px; font-weight: 700; color: #374151; white-space: nowrap;
        }
        table.tabla-import td { padding: 8px 10px; border-top: 1px solid #e5e7eb; vertical-align: middle; }
        table.tabla-import tr.dia-cab td {
            background: #f9fafb; font-weight: 800; color: #1f2937; font-size: 13px;
        }
        table.tabla-import tr.desconocido td { background: #fef2f2; }
        .pill-rol {
            display: inline-block; padding: 2px 9px; border-radius: 10px;
            font-size: 11px; font-weight: 700; color: white;
        }
        .pill-rol.sala { background: #3b82f6; } .pill-rol.cocina { background: #f97316; }
        .pill-rol.extra { background: #ff42a1; } .pill-rol.barra { background: #a21caf; }
        .pill-rol.limpieza { background: #14b8a6; } .pill-rol.encargado { background: #eab308; }
        .import-ok { color: #059669; font-weight: 700; }
        .import-mal { color: #b91c1c; font-weight: 700; }
        .import-aviso {
            padding: 11px 13px; border-radius: 8px; font-size: 13px; margin-bottom: 10px;
            background: #fef3c7; color: #92400e;
        }
        .import-aviso.error { background: #fee2e2; color: #7f1d1d; }
        .import-aviso.ok { background: #d1fae5; color: #065f46; }
        @media (prefers-color-scheme: dark) {
            .import-titulo { color: #e5e7eb; }
            .tabla-import-wrapper { border-color: #374151; }
            table.tabla-import th { background: #374151; color: #e5e7eb; }
            table.tabla-import td { border-top-color: #374151; color: #d1d5db; }
            table.tabla-import tr.dia-cab td { background: #111827; color: #e5e7eb; }
            table.tabla-import tr.desconocido td { background: #2d1515; }
        }

        /* Panel de "descanso 20 min" */
        .btn-desc-toggle {
            background: none;
            border: 1px dashed #cbd5e1;
            color: #64748b;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-desc-toggle:hover { background: #f1f5f9; color: #334155; }
        .descanso-panel {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #6b7280;
        }
        .descanso-panel .desc-lbl { font-size: 12px; }
        .descanso-panel .desc-suf { color: #9ca3af; }
        .descanso-panel .inp-descanso {
            width: 80px;
            padding: 3px 5px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: white;
            color: #1f2937;
        }
        .descanso-panel .btn-desc-remove {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 14px;
            font-weight: 700;
            padding: 0 2px;
            cursor: pointer;
            line-height: 1;
        }

        /* Panel de "cambio de rol a mitad de turno" */
        .btn-cambio-toggle {
            background: none;
            border: 1px dashed #cbd5e1;
            color: #64748b;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-cambio-toggle:hover { background: #f1f5f9; color: #334155; }
        .cambio-panel {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #6b7280;
        }
        .cambio-panel .cambio-lbl { font-weight: 700; color: #9ca3af; }
        .cambio-panel .inp-cambio {
            width: 80px;
            padding: 3px 5px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: white;
            color: #1f2937;
        }
        .cambio-panel .sel-rol2 {
            padding: 3px 4px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 12px;
            background: white;
            color: #1f2937;
            cursor: pointer;
        }
        .cambio-panel .btn-cambio-remove {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 14px;
            font-weight: 700;
            padding: 0 2px;
            cursor: pointer;
            line-height: 1;
        }
        tr.rol-cocina .td-empleado { border-left: 4px solid #f97316; }
        tr.rol-sala   .td-empleado { border-left: 4px solid #3b82f6; }
        tr.rol-mixto  .td-empleado { border-left: 4px solid #a855f7; }
        tr.rol-cocina .horario-cell input[type="time"] { border-color: #fed7aa; }
        tr.rol-sala   .horario-cell input[type="time"] { border-color: #bfdbfe; }
        tr.rol-mixto  .horario-cell input[type="time"] { border-color: #e9d5ff; }

        /* Leyenda de colores por rol */
        .leyenda {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 12px;
        }
        .leyenda-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .leyenda-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            display: inline-block;
        }
        .leyenda-dot.cocina    { background: #f97316; }
        .leyenda-dot.sala      { background: #3b82f6; }
        .leyenda-dot.mixto     { background: #a855f7; }
        .leyenda-dot.barra     { background: #a21caf; }
        .leyenda-dot.limpieza  { background: #14b8a6; }
        .leyenda-dot.encargado { background: #eab308; }
        .leyenda-dot.extra     { background: #ff42a1; }
        .leyenda-dot.sinrol    { background: #9ca3af; }
        .leyenda-info {
            margin-left: auto;
            font-size: 11px;
            color: #9ca3af;
        }

        /* Toggle libre */
        .libranza-toggle {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #6b7280;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
        }

        .libranza-toggle input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: #6b7280;
            cursor: pointer;
        }

        /* Mensaje */
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }

        .message.error {
            background: #fee2e2;
            color: #7f1d1d;
            display: block;
        }

        .message.info {
            background: #dbeafe;
            color: #1e40af;
            display: block;
        }

        .message.warning {
            background: #fef3c7;
            color: #92400e;
            display: block;
        }

        /* Barra inferior de acciones */
        .acciones-footer {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        /* Placeholder vacío */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #9ca3af;
        }

        .empty-state p {
            font-size: 15px;
            margin-top: 10px;
        }

        /* Modo Oscuro */
        @media (prefers-color-scheme: dark) {
            body {
                background: #111827;
            }

            .container {
                background: #1f2937;
                color: #e5e7eb;
            }

            .header h1 {
                color: #e5e7eb;
            }

            .filtros {
                background: #374151;
            }

            .filtro-grupo label {
                color: #9ca3af;
            }

            .filtro-grupo select {
                background: #374151;
                color: #e5e7eb;
                border-color: #4b5563;
            }

            .filtro-grupo select:focus {
                border-color: #60a5fa;
                box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
            }

            .semana-info {
                color: #6b7280;
            }

            .horario-grid-wrapper {
                border-color: #374151;
            }

            .horario-grid thead {
                background: #374151;
            }

            .horario-grid th {
                color: #e5e7eb;
                border-bottom-color: #4b5563;
            }

            .horario-grid td {
                border-bottom-color: #374151;
            }

            .horario-grid td.td-empleado {
                color: #e5e7eb;
            }

            .horario-grid tbody tr:hover {
                background: #2d3748;
            }

            .horario-cell input[type="time"] {
                background: #374151;
                color: #e5e7eb;
                border-color: #4b5563;
            }

            .horario-cell input[type="time"]:focus {
                border-color: #60a5fa;
                box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.1);
            }

            .horario-cell.es-libre {
                background: #2d3748;
            }

            .libranza-toggle {
                color: #9ca3af;
            }

            .turno-dur { color: #e5e7eb; }
            .turno-bar { background: #374151; }
            .leyenda { color: #9ca3af; }
            .leyenda-info { color: #6b7280; }
            .horario-grid th.col-total,
            .horario-grid td.td-total-sem {
                background: #374151;
                border-left-color: #4b5563;
            }
            .turno-total-sem { color: #e5e7eb; }
            .btn-cambio-toggle { border-color: #4b5563; color: #9ca3af; }
            .btn-cambio-toggle:hover { background: #374151; color: #e5e7eb; }
            .cambio-panel { color: #9ca3af; }
            .cambio-panel .cambio-lbl { color: #6b7280; }
            .cambio-panel .inp-cambio,
            .cambio-panel .sel-rol2 {
                background: #374151;
                color: #e5e7eb;
                border-color: #4b5563;
            }
            .cambio-panel .btn-cambio-remove { color: #f87171; }
            .rol1-row { color: #9ca3af; }
            .rol1-row .sel-rol1 {
                background: #374151;
                color: #e5e7eb;
                border-color: #4b5563;
            }
            .btn-desc-toggle { border-color: #4b5563; color: #9ca3af; }
            .btn-desc-toggle:hover { background: #374151; color: #e5e7eb; }
            .descanso-panel { color: #9ca3af; }
            .descanso-panel .desc-suf { color: #6b7280; }
            .descanso-panel .inp-descanso {
                background: #374151;
                color: #e5e7eb;
                border-color: #4b5563;
            }
            .descanso-panel .btn-desc-remove { color: #f87171; }
            .turno-bar-desc { background: #f9fafb; outline-color: rgba(0,0,0,0.5); }
            .resumen-titulo { color: #e5e7eb; }
            .gantt-day {
                background: #111827;
                border-color: #374151;
            }
            .gantt-day-title { color: #e5e7eb; }
            .gantt-axis {
                color: #9ca3af;
                border-bottom-color: #4b5563;
            }
            .gantt-label { color: #d1d5db; }
            .gantt-track {
                background:
                    repeating-linear-gradient(to right,
                      transparent 0, transparent calc(100%/19.5 - 1px),
                      #374151    calc(100%/19.5 - 1px), #374151    calc(100%/19.5));
            }
            .gantt-empty { color: #6b7280; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .filtros {
                flex-direction: column;
                gap: 12px;
            }

            .filtro-grupo {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <i data-lucide="calendar-clock" aria-hidden="true" style="width:26px;height:26px;vertical-align:middle;margin-right:8px"></i>
                Horario de Turno
            </h1>
            <div class="header-buttons">
                <button class="btn-enviar" id="btnSubirHorario" style="background:#059669" aria-label="Subir el horario desde Excel">
                    <i data-lucide="upload" aria-hidden="true" style="width:15px;height:15px"></i> Subir horario (Excel)
                    <input type="file" id="fileHorario" accept=".xlsx" style="display:none">
                </button>
                <button class="btn-enviar" id="btnResumenDia" style="background:#f59e0b" aria-label="Ver el resumen del día">
                    <i data-lucide="sunrise" aria-hidden="true" style="width:15px;height:15px"></i> Resumen del día
                </button>
                <button class="btn-volver" id="btnVolver" aria-label="Volver a administración">
                    <i data-lucide="arrow-left" aria-hidden="true" style="width:15px;height:15px"></i> Volver
                </button>
                <button class="btn-logout" id="btnLogout" aria-label="Cerrar sesión">
                    <i data-lucide="log-out" aria-hidden="true" style="width:15px;height:15px"></i> Cerrar sesión
                </button>
            </div>
        </div>

        <!-- Filtros: Centro y Semana -->
        <div class="filtros">
            <div class="filtro-grupo">
                <label for="selectCentro">
                    <i data-lucide="building-2" aria-hidden="true" style="width:13px;height:13px;vertical-align:middle;margin-right:4px"></i>
                    Centro de trabajo
                </label>
                <select id="selectCentro" aria-label="Seleccionar centro">
                    <option value="">-- Selecciona un centro --</option>
                </select>
            </div>
            <div class="filtro-grupo">
                <label for="selectSemana">
                    <i data-lucide="calendar" aria-hidden="true" style="width:13px;height:13px;vertical-align:middle;margin-right:4px"></i>
                    Semana
                </label>
                <select id="selectSemana" aria-label="Seleccionar semana">
                    <option value="">-- Selecciona una semana --</option>
                </select>
                <span class="semana-info" id="semanaInfo"></span>
            </div>
            <div id="estadoSemanaWrapper" style="display:none;align-self:flex-end;padding-bottom:2px">
                <span class="estado-semana" id="estadoSemana"></span>
            </div>
        </div>

        <!-- Mensaje de estado -->
        <div id="message" class="message" role="alert" aria-live="polite" aria-atomic="true"></div>

        <!-- Vista previa de la importación -->
        <div id="importPanel" style="display:none">
            <div class="import-cab">
                <div>
                    <h2 class="import-titulo">Esto es lo que he entendido de tu archivo</h2>
                    <p class="import-sub" id="importResumen"></p>
                </div>
                <div class="import-acciones">
                    <button type="button" class="btn-volver" id="btnImportCancelar">Cancelar</button>
                    <button type="button" class="btn-enviar" id="btnImportConfirmar" style="background:#059669">Guardar horario</button>
                </div>
            </div>
            <div id="importAvisos"></div>
            <div class="tabla-import-wrapper"><div id="importTabla"></div></div>
        </div>

        <!-- Leyenda de colores por rol -->
        <div class="leyenda" id="leyendaRoles" style="display:none">
            <span class="leyenda-chip"><span class="leyenda-dot sala"></span> Sala</span>
            <span class="leyenda-chip"><span class="leyenda-dot cocina"></span> Cocina</span>
            <span class="leyenda-chip"><span class="leyenda-dot barra"></span> Barra</span>
            <span class="leyenda-chip"><span class="leyenda-dot limpieza"></span> Limpieza</span>
            <span class="leyenda-chip"><span class="leyenda-dot encargado"></span> Encargado</span>
            <span class="leyenda-chip"><span class="leyenda-dot extra"></span> Extra</span>
            <span class="leyenda-chip"><span class="leyenda-dot mixto"></span> Mixto</span>
            <span class="leyenda-chip"><span class="leyenda-dot sinrol"></span> Sin rol</span>
            <span class="leyenda-info">Rango operativo 07:30 → 03:00 · pasos de 30 min</span>
        </div>

        <!-- Resumen semanal (Gantt por día) — bajo la tabla al final del archivo -->
        <!-- Tabla de horario (JS la renderiza) -->
        <div id="tablaHorario" class="horario-grid-wrapper">
            <div class="empty-state">
                <i data-lucide="calendar-x" aria-hidden="true" style="width:40px;height:40px;color:#d1d5db"></i>
                <p>Selecciona un centro y una semana para cargar el horario</p>
            </div>
        </div>

        <!-- Resumen semanal por día (Gantt de franjas de media hora) -->
        <div id="resumenSemana" class="resumen-semana" style="display:none">
            <h2 class="resumen-titulo">Resumen semanal</h2>
            <div id="resumenDias"></div>
        </div>

        <!-- Acciones -->
        <div class="acciones-footer">
            <button class="btn-enviar" id="btnEnviar" disabled aria-label="Enviar horario para validación">
                <i data-lucide="send" aria-hidden="true" style="width:15px;height:15px"></i> Enviar para validación
            </button>
        </div>
    </div>

    <script>
    (function() {
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });
    })();
    </script>
    <script type="module" src="horario-encargado.js?v=2"></script>
</body>
</html>
