<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Tareas · Fichaje</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100dvh;
            padding: 16px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 20px;
            max-width: 780px;
            margin: 0 auto;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
        }
        .header h1 { color: #1f2937; font-size: 21px; }
        .chip {
            display: inline-block; background: #2563eb; color: white;
            padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
        }
        button { font-family: inherit; cursor: pointer; border: none; font-weight: 600; }
        .btn-volver {
            background: #6b7280; color: white; padding: 9px 14px; border-radius: 8px;
            font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-volver:hover { background: #4b5563; }

        .aviso {
            background: #fef3c7; color: #92400e; padding: 12px 14px;
            border-radius: 8px; font-size: 14px; margin-bottom: 14px;
        }
        .aviso.error { background: #fee2e2; color: #7f1d1d; }
        .aviso.ok { background: #d1fae5; color: #065f46; }
        .aviso.info { background: #dbeafe; color: #1e40af; }

        label.campo { display: block; font-size: 12px; font-weight: 700; color: #6b7280; margin-bottom: 6px; }

        .emp-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px; margin-bottom: 14px;
        }
        .btn-emp {
            background: #f3f4f6; color: #374151; border: 2px solid #e5e7eb;
            border-radius: 10px; padding: 12px 8px; font-size: 15px;
        }
        .btn-emp.selected { background: #2563eb; color: white; border-color: #2563eb; }
        .btn-nosoyyo {
            background: none; border: none; color: #9ca3af; font-size: 12px;
            text-decoration: underline; cursor: pointer; margin: -6px 0 14px; padding: 4px 0;
            font-weight: 600; display: block;
        }

        .barra-estado {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            background: #f9fafb; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px;
        }
        .progreso { font-size: 15px; font-weight: 700; color: #1f2937; }
        .progreso-sub { font-size: 12px; color: #6b7280; }
        .pill-bloq {
            background: #fee2e2; color: #b91c1c; padding: 3px 10px;
            border-radius: 10px; font-size: 12px; font-weight: 700; margin-left: auto;
        }

        .tabs { display: flex; gap: 6px; border-bottom: 1px solid #e5e7eb; margin-bottom: 12px; }
        .tab {
            background: none; color: #6b7280; padding: 9px 14px; font-size: 14px;
            border-bottom: 3px solid transparent;
        }
        .tab.active { color: #2563eb; border-bottom-color: #2563eb; }

        .bloque-titulo {
            font-size: 12px; font-weight: 800; color: #6b7280; text-transform: uppercase;
            letter-spacing: .5px; margin: 16px 0 8px;
        }

        .tarea {
            border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px;
            margin-bottom: 8px; background: white;
        }
        .tarea.hecha { background: #f0fdf4; border-color: #bbf7d0; }
        .tarea.vencida { background: #fef2f2; border-color: #fecaca; }
        .tarea.no-aplica { background: #f9fafb; border-color: #e5e7eb; opacity: .75; }
        .tarea.futura { opacity: .6; }

        .tarea-cab { display: flex; align-items: flex-start; gap: 10px; }
        .tarea-check {
            width: 24px; height: 24px; border-radius: 6px; border: 2px solid #d1d5db;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 800; color: white; margin-top: 2px;
        }
        .tarea.hecha .tarea-check { background: #10b981; border-color: #10b981; }
        .tarea.vencida .tarea-check { border-color: #ef4444; color: #ef4444; background: white; }
        .tarea.no-aplica .tarea-check { background: #9ca3af; border-color: #9ca3af; }
        .tarea-main { flex: 1; min-width: 0; }
        .tarea-nombre { font-size: 15px; font-weight: 700; color: #1f2937; }
        .tarea.hecha .tarea-nombre { text-decoration: line-through; color: #6b7280; }
        .tarea-meta { font-size: 12px; color: #6b7280; margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .badge {
            padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700;
        }
        .badge-bloq { background: #fee2e2; color: #b91c1c; }
        .badge-rol { background: #e5e7eb; color: #374151; }
        .badge-rol.sala { background: #dbeafe; color: #1e40af; }
        .badge-rol.cocina { background: #ffedd5; color: #9a3412; }
        .badge-rol.barra { background: #fae8ff; color: #86198f; }
        .badge-rol.limpieza { background: #ccfbf1; color: #115e59; }
        .badge-rol.encargado { background: #fef3c7; color: #92400e; }
        .badge-tarde { background: #fef3c7; color: #92400e; }
        .badge-rafaga { background: #fee2e2; color: #b91c1c; }

        .tarea-acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .btn-hacer {
            background: #10b981; color: white; padding: 11px 16px; border-radius: 8px; font-size: 14px;
        }
        .btn-hacer:hover { background: #059669; }
        .btn-hacer:disabled { background: #d1d5db; color: #6b7280; cursor: not-allowed; }
        .btn-sec {
            background: white; color: #6b7280; border: 1px solid #d1d5db;
            padding: 9px 12px; border-radius: 8px; font-size: 13px;
        }
        .btn-sec:hover { background: #f9fafb; }

        .instrucciones {
            background: #f9fafb; border-radius: 8px; padding: 10px 12px; margin-top: 10px;
            font-size: 13px; color: #374151; white-space: pre-wrap;
        }
        .evidencia { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
        .evidencia input[type="number"], .evidencia input[type="text"], .evidencia textarea {
            width: 100%; padding: 10px; border: 2px solid #e5e7eb; border-radius: 8px;
            font-size: 16px; font-family: inherit;
        }
        .evidencia textarea { min-height: 64px; resize: vertical; }
        .foto-zona {
            border: 2px dashed #d1d5db; border-radius: 8px; padding: 14px; text-align: center;
            color: #6b7280; font-size: 13px;
        }
        .foto-zona img { max-width: 100%; max-height: 180px; border-radius: 6px; margin-top: 8px; }
        .foto-btn {
            background: #2563eb; color: white; padding: 11px 16px; border-radius: 8px;
            font-size: 14px; display: inline-flex; align-items: center; gap: 8px;
        }
        .rango-hint { font-size: 12px; color: #6b7280; }

        .completada-info { font-size: 12px; color: #059669; margin-top: 6px; font-weight: 600; }

        .vacio { text-align: center; padding: 40px 20px; color: #9ca3af; font-size: 14px; }

        /* Modal PIN */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,.55);
            display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
        }
        .modal.visible { display: flex; }
        .modal-card {
            background: white; border-radius: 14px; padding: 22px; width: 100%; max-width: 340px;
        }
        .modal-card h2 { font-size: 18px; color: #1f2937; margin-bottom: 6px; }
        .modal-card p { font-size: 13px; color: #6b7280; margin-bottom: 14px; }
        .pin-display {
            font-size: 30px; letter-spacing: 10px; text-align: center; font-weight: 800;
            color: #1f2937; margin-bottom: 14px; min-height: 40px; font-family: 'Courier New', monospace;
        }
        .pin-teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .pin-teclado button {
            background: #f3f4f6; color: #1f2937; padding: 16px 0; border-radius: 10px; font-size: 19px;
        }
        .pin-teclado button:hover { background: #e5e7eb; }
        .pin-error { color: #b91c1c; font-size: 13px; margin-top: 10px; min-height: 18px; }
        .modal-acciones { display: flex; gap: 8px; margin-top: 14px; }
        .modal-acciones button { flex: 1; padding: 11px; border-radius: 8px; font-size: 14px; }
        .btn-cancelar { background: #f3f4f6; color: #374151; }

        @media (prefers-color-scheme: dark) {
            body { background: #111827; }
            .container { background: #1f2937; color: #e5e7eb; }
            .header h1 { color: #e5e7eb; }
            .btn-emp { background: #374151; color: #e5e7eb; border-color: #4b5563; }
            .barra-estado { background: #374151; }
            .progreso { color: #e5e7eb; }
            .tabs { border-bottom-color: #4b5563; }
            .tab { color: #9ca3af; }
            .tab.active { color: #60a5fa; border-bottom-color: #60a5fa; }
            .tarea { background: #111827; border-color: #374151; }
            .tarea.hecha { background: #022c22; border-color: #064e3b; }
            .tarea.vencida { background: #2d1515; border-color: #7f1d1d; }
            .tarea.no-aplica { background: #1f2937; }
            .tarea-nombre { color: #e5e7eb; }
            .instrucciones { background: #374151; color: #d1d5db; }
            .evidencia input, .evidencia textarea { background: #374151; color: #e5e7eb; border-color: #4b5563; }
            .foto-zona { border-color: #4b5563; color: #9ca3af; }
            .btn-sec { background: #374151; color: #d1d5db; border-color: #4b5563; }
            .modal-card { background: #1f2937; }
            .modal-card h2 { color: #e5e7eb; }
            .pin-display { color: #e5e7eb; }
            .pin-teclado button { background: #374151; color: #e5e7eb; }
            .btn-cancelar { background: #374151; color: #e5e7eb; }
        }
        /* Cámara propia para las fotos de tarea */
        .cam-modal {
            display: none; position: fixed; inset: 0; background: #000; z-index: 90;
            flex-direction: column;
        }
        .cam-modal.visible { display: flex; }
        .cam-modal video { flex: 1; width: 100%; object-fit: cover; min-height: 0; }
        .cam-acciones {
            display: flex; gap: 12px; padding: 16px;
            padding-bottom: max(16px, env(safe-area-inset-bottom)); background: #000;
        }
        .cam-acciones button {
            flex: 1; padding: 16px; border-radius: 10px; font-size: 16px;
            font-weight: 700; border: none; cursor: pointer;
        }
        .cam-disparar { background: #10b981; color: white; flex: 2; }
        .cam-cancelar { background: #374151; color: #e5e7eb; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>
            <i data-lucide="clipboard-check" style="width:21px;height:21px;vertical-align:middle;margin-right:6px"></i>
            Tareas <span class="chip" id="centroChip"></span>
        </h1>
        <button class="btn-volver" onclick="volver()">
            <i data-lucide="arrow-left" style="width:14px;height:14px"></i> Volver
        </button>
    </div>

    <div id="aviso" class="aviso" style="display:none"></div>

    <label class="campo">¿Quién eres?</label>
    <div class="emp-grid" id="empGrid"><span style="color:#9ca3af;font-size:13px">Cargando...</span></div>

    <div class="barra-estado">
        <div>
            <div class="progreso" id="progreso">—</div>
            <div class="progreso-sub" id="jornadaInfo"></div>
        </div>
        <span class="pill-bloq" id="pillBloq" style="display:none"></span>
    </div>

    <div class="tabs">
        <button class="tab active" data-filtro="mias">Mis tareas</button>
        <button class="tab" data-filtro="todas">Todas del local</button>
    </div>

    <div id="lista"><div class="vacio">Selecciona tu nombre para ver tus tareas.</div></div>
</div>

<!-- Modal PIN -->
<div class="modal" id="pinModal" role="dialog" aria-modal="true">
    <div class="modal-card">
        <h2>Confirma con tu PIN</h2>
        <p id="pinSub">Introduce tu PIN de 4 dígitos.</p>
        <div class="pin-display" id="pinDisplay"></div>
        <div class="pin-teclado">
            <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
            <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
            <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
            <button type="button" data-k="del">←</button><button type="button" data-k="0">0</button><button type="button" data-k="ok">OK</button>
        </div>
        <div class="pin-error" id="pinError"></div>
        <div class="modal-acciones">
            <button class="btn-cancelar" type="button" onclick="cerrarPin()">Cancelar</button>
        </div>
    </div>
</div>

<script>
(function () {
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const centro = params.get('centro');

    const BLOQUE_LABEL = {
        APERTURA: 'Apertura', DURANTE_SERVICIO: 'Durante el servicio',
        CAMBIO_TURNO: 'Cambio de turno', CIERRE: 'Cierre',
        SEMANAL: 'Semanal', MENSUAL: 'Mensual',
    };
    const ORDEN_BLOQUES = ['APERTURA', 'DURANTE_SERVICIO', 'CAMBIO_TURNO', 'CIERRE', 'SEMANAL', 'MENSUAL'];

    let empleados = [];
    let empleadoSel = '';
    let rolSel = '';
    let datos = null;
    let filtro = 'mias';
    const deviceId = obtenerDeviceId();
    const esEncargado = sessionStorage.getItem('encargadoToken') === 'auth-token-fichaje-encargado'
                     || sessionStorage.getItem('adminToken') === 'auth-token-fichaje-admin';
    const authToken = sessionStorage.getItem('adminToken') || sessionStorage.getItem('encargadoToken') || '';

    // Sesión de PIN corta (§7): 90 s de inactividad y se vuelve a pedir.
    const PIN_TTL = 90 * 1000;
    let pinCache = { valor: '', ts: 0, empleado: '' };
    let pinResolver = null;

    // ── Código del bar ────────────────────────────────────────
    // Lo deja la cámara del móvil en la dirección al abrir la app. Las tareas
    // con foto lo exigen: es lo que demuestra que la persona está en el local.
    const QR_VIDA_MS = 50000;
    (function guardarCodigoDeLaUrl() {
        const qr = new URLSearchParams(location.search).get('qr');
        if (!qr) return;
        try {
            sessionStorage.setItem('qrCodigo', qr);
            sessionStorage.setItem('qrLeidoEn', String(Date.now()));
        } catch {}
    })();

    /** La sesión guardada en este móvil al entrar con el PIN, si la hay. */
    function sesionActual() {
        try {
            const s = JSON.parse(localStorage.getItem('sesionEmpleado') || 'null');
            return s && s.sesion && s.nombre ? s : null;
        } catch { return null; }
    }

    /** Testigo de la sesión del empleado en este móvil, si la hay. */
    function testigoSesion() {
        return sesionActual()?.sesion || '';
    }

    /** ¿La sesión de este móvil es de esta persona? */
    function sesionEsDe(nombre) {
        return sesionActual()?.nombre === nombre;
    }

    function codigoDelBar() {
        try {
            const qr = sessionStorage.getItem('qrCodigo') || '';
            const leidoEn = Number(sessionStorage.getItem('qrLeidoEn') || 0);
            return (!qr || Date.now() - leidoEn > QR_VIDA_MS) ? '' : qr;
        } catch { return ''; }
    }

    function obtenerDeviceId() {
        let id = localStorage.getItem('device_id');
        if (!id) {
            id = 'dev_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
            localStorage.setItem('device_id', id);
        }
        return id;
    }

    window.volver = () => {
        location.href = centro ? `/?centro=${encodeURIComponent(centro)}` : '/';
    };

    function aviso(txt, tipo = 'info', ms = 4000) {
        const el = $('aviso');
        if (!txt) { el.style.display = 'none'; return; }
        el.className = 'aviso ' + tipo;
        el.textContent = txt;
        el.style.display = 'block';
        if (ms) setTimeout(() => { if (el.textContent === txt) el.style.display = 'none'; }, ms);
    }

    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const hhmm = ts => new Date(ts).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

    // ── PIN ───────────────────────────────────────────────────
    function pinVigente() {
        return pinCache.valor && pinCache.empleado === empleadoSel && (Date.now() - pinCache.ts) < PIN_TTL;
    }
    function pedirPin(subtitulo) {
        if (pinVigente()) {
            pinCache.ts = Date.now();
            return Promise.resolve(pinCache.valor);
        }
        $('pinSub').textContent = subtitulo || `Introduce tu PIN, ${empleadoSel}.`;
        $('pinDisplay').textContent = '';
        $('pinError').textContent = '';
        $('pinModal').classList.add('visible');
        return new Promise(resolve => { pinResolver = resolve; });
    }
    window.cerrarPin = () => {
        $('pinModal').classList.remove('visible');
        if (pinResolver) { pinResolver(null); pinResolver = null; }
    };
    let pinBuffer = '';
    document.querySelectorAll('.pin-teclado button').forEach(b => {
        b.addEventListener('click', () => {
            const k = b.dataset.k;
            if (k === 'del') pinBuffer = pinBuffer.slice(0, -1);
            else if (k === 'ok') {
                if (pinBuffer.length < 4) { $('pinError').textContent = 'El PIN tiene al menos 4 dígitos'; return; }
                const v = pinBuffer;
                pinBuffer = '';
                $('pinModal').classList.remove('visible');
                pinCache = { valor: v, ts: Date.now(), empleado: empleadoSel };
                if (pinResolver) { pinResolver(v); pinResolver = null; }
                return;
            } else if (pinBuffer.length < 6) pinBuffer += k;
            $('pinDisplay').textContent = '•'.repeat(pinBuffer.length);
        });
    });

    // ── Carga ─────────────────────────────────────────────────
    async function cargarEmpleados() {
        try {
            const r = await fetch(`/api/empleados?centro=${encodeURIComponent(centro)}`);
            empleados = await r.json();
        } catch { empleados = []; }

        const cont = $('empGrid');
        if (!empleados.length) { cont.innerHTML = '<span style="color:#9ca3af;font-size:13px">Sin empleados</span>'; return; }

        // Con sesión iniciada en este móvil no hace falta elegir: ya se sabe
        // quién es. Se deja solo su nombre y un botón para salir de esa sesión.
        const sesion = sesionActual();
        const propio = sesion ? empleados.find(e => e.nombre === sesion.nombre) : null;
        const visibles = propio ? [propio] : empleados;

        cont.innerHTML = '';
        visibles.forEach(e => {
            const b = document.createElement('button');
            b.className = 'btn-emp';
            b.type = 'button';
            b.textContent = e.nombre;
            b.addEventListener('click', () => seleccionar(e, b));
            cont.appendChild(b);
        });

        document.getElementById('btnCerrarSesion')?.remove();
        if (propio) {
            seleccionar(propio, cont.querySelector('.btn-emp'));
            const salir = document.createElement('button');
            salir.type = 'button';
            salir.id = 'btnCerrarSesion';
            salir.className = 'btn-nosoyyo';
            salir.textContent = 'Cerrar sesión';
            salir.addEventListener('click', () => {
                if (!confirm('Se cerrará tu sesión en este móvil. ¿Seguro?')) return;
                try {
                    localStorage.removeItem('sesionEmpleado');
                    localStorage.removeItem('empleadoHabitual');
                } catch {}
                window.location.href = '/';
            });
            cont.insertAdjacentElement('afterend', salir);
        }
    }

    function seleccionar(e, btn) {
        document.querySelectorAll('.btn-emp').forEach(x => x.classList.remove('selected'));
        btn.classList.add('selected');
        empleadoSel = e.nombre;
        rolSel = (e.rol || '').toLowerCase();
        pinCache = { valor: '', ts: 0, empleado: '' };
        if (!e.tiene_pin) {
            aviso(`${e.nombre} todavía no tiene PIN. Pídeselo al encargado para poder registrar tareas.`, 'error', 8000);
        }
        render();
    }

    async function cargarTareas() {
        try {
            const r = await fetch(`/api/tareas?centro=${encodeURIComponent(centro)}`, { cache: 'no-store' });
            if (!r.ok) throw new Error();
            datos = await r.json();
        } catch {
            datos = null;
            aviso('No se pudieron cargar las tareas', 'error');
        }
        render();
    }

    // ¿La tarea es "mía"? El rol mixto cubre sala y cocina.
    function esMia(t) {
        if (!rolSel) return false;
        const rol = t.rol_responsable;
        if (rolSel === 'mixto') return rol === 'SALA' || rol === 'COCINA';
        return rolSel.toUpperCase() === rol;
    }

    function render() {
        if (!datos) return;
        const todas = datos.tareas || [];
        const r = datos.resumen || { total: 0, completadas: 0, bloqueantes_pendientes: 0 };

        $('progreso').textContent = `${r.completadas}/${r.total} completadas`;
        $('jornadaInfo').textContent = `Jornada del ${datos.fecha_operativa} · abre a las ${datos.inicio_jornada}`;
        const pill = $('pillBloq');
        if (r.bloqueantes_pendientes > 0) {
            pill.style.display = 'inline-block';
            pill.textContent = `${r.bloqueantes_pendientes} bloqueante${r.bloqueantes_pendientes !== 1 ? 's' : ''} sin hacer`;
        } else pill.style.display = 'none';

        const lista = $('lista');
        if (!empleadoSel) {
            lista.innerHTML = '<div class="vacio">Selecciona tu nombre para ver tus tareas.</div>';
            return;
        }

        const visibles = filtro === 'mias' ? todas.filter(esMia) : todas;
        if (!visibles.length) {
            lista.innerHTML = `<div class="vacio">${filtro === 'mias'
                ? 'No tienes tareas asignadas hoy. Mira "Todas del local".'
                : 'No hay tareas para esta jornada.'}</div>`;
            return;
        }

        let html = '';
        for (const bloque of ORDEN_BLOQUES) {
            const delBloque = visibles.filter(t => t.bloque === bloque);
            if (!delBloque.length) continue;
            html += `<div class="bloque-titulo">${BLOQUE_LABEL[bloque] || bloque}</div>`;
            html += delBloque.map(tarjeta).join('');
        }
        lista.innerHTML = html;

        lista.querySelectorAll('[data-hacer]').forEach(b =>
            b.addEventListener('click', () => completar(Number(b.dataset.hacer))));
        lista.querySelectorAll('[data-foto]').forEach(btn =>
            btn.addEventListener('click', () => onFoto(Number(btn.dataset.foto))));
        lista.querySelectorAll('[data-noaplica]').forEach(b =>
            b.addEventListener('click', () => noAplica(Number(b.dataset.noaplica))));
        lista.querySelectorAll('[data-reabrir]').forEach(b =>
            b.addEventListener('click', () => reabrir(Number(b.dataset.reabrir))));

        if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function tarjeta(t) {
        const ahora = Date.now();
        const cerrada = t.estado === 'COMPLETADA' || t.estado === 'COMPLETADA_TARDIA';
        const noAplica = t.estado === 'NO_APLICA';
        const vencida = t.estado === 'VENCIDA';
        const futura = ahora < Number(t.ventana_inicio_ts);
        const cls = cerrada ? 'hecha' : noAplica ? 'no-aplica' : vencida ? 'vencida' : futura ? 'futura' : '';

        const check = cerrada ? '✓' : noAplica ? '–' : vencida ? '!' : '';
        const rolCls = (t.rol_responsable || '').toLowerCase();

        let meta = `<span>${hhmm(t.ventana_inicio_ts)} – ${hhmm(t.ventana_fin_ts)}</span>`;
        meta += `<span class="badge badge-rol ${rolCls}">${esc(t.rol_responsable)}</span>`;
        if (t.criticidad === 'BLOQUEANTE') meta += `<span class="badge badge-bloq">Bloqueante</span>`;
        if (t.fuera_de_plazo) meta += `<span class="badge badge-tarde">Fuera de plazo</span>`;
        if (t.flag_rafaga) meta += `<span class="badge badge-rafaga">Ráfaga</span>`;

        let cuerpo = '';
        if (cerrada) {
            cuerpo = `<div class="completada-info">✓ ${esc(t.completada_por)} · ${hhmm(t.completada_ts_servidor)}${t.estado === 'COMPLETADA_TARDIA' ? ' (tardía)' : ''}</div>`;
            if (t.nota) cuerpo += `<div class="instrucciones">${esc(t.nota)}</div>`;
        } else if (noAplica) {
            cuerpo = `<div class="completada-info" style="color:#6b7280">No aplica: ${esc(t.motivo_no_aplica)}</div>`;
        } else if (futura) {
            cuerpo = `<div class="tarea-meta">Se activa a las ${hhmm(t.ventana_inicio_ts)}</div>`;
        } else {
            if (t.instrucciones) cuerpo += `<div class="instrucciones">${esc(t.instrucciones)}</div>`;
            cuerpo += camposEvidencia(t);
            const necesitaFoto = t.tipo_evidencia === 'FOTO' || t.tipo_evidencia === 'FOTO+NUMERO';
            const faltaFoto = necesitaFoto && !fotos[t.id];
            const puede = (!vencida || esEncargado) && !faltaFoto;
            cuerpo += `<div class="tarea-acciones">
                <button class="btn-hacer" data-hacer="${t.id}" ${puede ? '' : 'disabled'}>
                    ${vencida ? 'Completar (tardía)' : 'Completar'}
                </button>
                ${esEncargado ? `<button class="btn-sec" data-noaplica="${t.id}">No aplica</button>` : ''}
            </div>`;
            if (faltaFoto) {
                cuerpo += `<div class="tarea-meta" id="avisofoto-${t.id}" style="color:#b91c1c">Haz la foto para poder completarla.</div>`;
            }
            if (vencida && !esEncargado) {
                cuerpo += `<div class="tarea-meta" style="color:#b91c1c">Ha vencido: solo el encargado puede cerrarla.</div>`;
            }
        }

        if ((cerrada || noAplica) && esEncargado) {
            cuerpo += `<div class="tarea-acciones"><button class="btn-sec" data-reabrir="${t.id}">Reabrir</button></div>`;
        }

        return `<div class="tarea ${cls}" id="tarea-${t.id}">
            <div class="tarea-cab">
                <div class="tarea-check">${check}</div>
                <div class="tarea-main">
                    <div class="tarea-nombre">${esc(t.nombre)}</div>
                    <div class="tarea-meta">${meta}</div>
                    ${cuerpo}
                </div>
            </div>
        </div>`;
    }

    function camposEvidencia(t) {
        const tipo = t.tipo_evidencia;
        let cfg = {};
        try { cfg = JSON.parse(t.evidencia_config || '{}'); } catch {}
        let html = '<div class="evidencia">';

        if (tipo === 'NUMERO' || tipo === 'FOTO+NUMERO') {
            const hint = (cfg.min !== undefined && cfg.max !== undefined)
                ? `<div class="rango-hint">Rango esperado: ${cfg.min} a ${cfg.max} ${esc(cfg.unidad || '')}</div>` : '';
            html += `<div>
                <label class="campo">Valor${cfg.unidad ? ' (' + esc(cfg.unidad) + ')' : ''}</label>
                <input type="number" step="0.1" inputmode="decimal" id="num-${t.id}" placeholder="0">
                ${hint}
            </div>`;
        }
        if (tipo === 'TEXTO') {
            html += `<div>
                <label class="campo">Anotación</label>
                <textarea id="txt-${t.id}" placeholder="Escribe lo que has comprobado"></textarea>
            </div>`;
        }
        if (tipo === 'FOTO' || tipo === 'FOTO+NUMERO') {
            html += `<div class="foto-zona" id="fotozona-${t.id}">
                <button type="button" class="foto-btn" data-foto="${t.id}">
                    <i data-lucide="camera" style="width:16px;height:16px"></i> Hacer foto
                </button>
                <div id="fotoprev-${t.id}"></div>
            </div>`;
        }
        html += `<div>
            <label class="campo">Nota (opcional)</label>
            <input type="text" id="nota-${t.id}" placeholder="Añade una observación si hace falta">
        </div>`;
        html += '</div>';
        return html;
    }

    // ── Foto: reescalado en cliente + heurística de captura ────
    const fotos = {}; // id → { b64, origen }

    function aJpegPequeno(fuente, w0, h0) {
        const MAX = 1024;
        let w = w0, h = h0;
        if (w > MAX || h > MAX) {
            const f = Math.min(MAX / w, MAX / h);
            w = Math.round(w * f); h = Math.round(h * f);
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(fuente, 0, 0, w, h);
        return c.toDataURL('image/jpeg', 0.6);
    }

    function guardarFoto(id, b64, origen) {
        fotos[id] = { b64, origen };
        const prev = $(`fotoprev-${id}`);
        if (prev) {
            prev.innerHTML = `<img src="${b64}" alt="Foto de la tarea">`
                + (origen !== 'camara'
                    ? '<div class="rango-hint" style="color:#b91c1c">Foto elegida de archivo: quedará marcada para revisión.</div>'
                    : '');
        }
        // Se habilita aquí en vez de volver a pintar la tarjeta entera: un
        // repintado borraría la nota o el número que ya hubiera escrito.
        const boton = document.querySelector(`.btn-hacer[data-hacer="${id}"]`);
        if (boton) boton.disabled = false;
        document.getElementById(`avisofoto-${id}`)?.remove();
    }

    /**
     * Cámara dentro de la app. Antes era un selector de archivos y, aunque
     * llevara `capture`, el iPhone seguía ofreciendo la fototeca: se podía
     * "hacer" la tarea con una foto vieja. Aquí no hay galería que elegir.
     */
    async function onFoto(id) {
        let stream;
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: 'environment' } }, audio: false,
            });
        } catch {
            return respaldoSelector(id);   // sin permiso, no se deja a nadie tirado
        }

        const modal = $('camModal');
        const video = $('camVideo');
        video.srcObject = stream;
        await video.play().catch(() => {});
        modal.classList.add('visible');

        const cerrar = () => {
            stream.getTracks().forEach(t => t.stop());
            video.srcObject = null;
            modal.classList.remove('visible');
        };
        $('camDisparar').onclick = () => {
            guardarFoto(id, aJpegPequeno(video, video.videoWidth, video.videoHeight), 'camara');
            cerrar();
        };
        $('camCancelar').onclick = cerrar;
    }

    function respaldoSelector(id) {
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
        inp.onchange = ev => {
            const file = ev.target.files && ev.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => guardarFoto(id, aJpegPequeno(img, img.width, img.height), 'selector');
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        };
        inp.click();
    }

    // ── Acciones ──────────────────────────────────────────────
    async function completar(id) {
        if (!empleadoSel) { aviso('Selecciona tu nombre primero', 'error'); return; }
        const t = ((datos && datos.tareas) || []).find(x => Number(x.id) === id);
        if (!t) return;

        // En su propio móvil ya entró con el PIN: no tiene sentido pedírselo otra
        // vez cada minuto y medio. En la tablet compartida sí se sigue pidiendo.
        let pin = '';
        if (!sesionEsDe(empleadoSel)) {
            pin = await pedirPin(`Confirma la tarea "${t.nombre}" con tu PIN.`);
            if (!pin) return;
        }

        const body = {
            instancia_id: id,
            empleado: empleadoSel,
            pin,
            sesion: testigoSesion(),
            device_id: deviceId,
            ts_cliente: Date.now(),
            idempotency_key: `${id}-${empleadoSel}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
            nota: ($(`nota-${id}`) || {}).value || '',
        };
        const num = $(`num-${id}`);
        if (num && num.value !== '') body.valor_numerico = num.value;
        const txt = $(`txt-${id}`);
        if (txt) body.texto = txt.value;
        if (fotos[id]) {
            body.foto_b64 = fotos[id].b64;
            body.origen_captura = fotos[id].origen;
            // Las tareas con foto exigen estar en el bar: viaja el código leído.
            body.qr = codigoDelBar();
        }

        try {
            const r = await fetch('/api/tareas?accion=completar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Auth-Token': authToken,
                    'X-Device-Id': deviceId,
                },
                body: JSON.stringify(body),
            });
            const data = await r.json().catch(() => ({}));
            if (!r.ok) {
                if (r.status === 403 && /PIN/i.test(data.error || '')) pinCache = { valor: '', ts: 0, empleado: '' };
                aviso(data.error || 'No se pudo completar la tarea', 'error', 6000);
                return;
            }
            delete fotos[id];
            aviso(data.aviso ? `✓ Registrada. ${data.aviso}` : '✓ Tarea registrada', data.aviso ? 'aviso' : 'ok');
            await cargarTareas();
        } catch {
            aviso('Error de conexión al registrar la tarea', 'error');
        }
    }

    async function noAplica(id) {
        const motivo = prompt('Motivo por el que no aplica (obligatorio):');
        if (!motivo || !motivo.trim()) return;
        await accionEncargado(id, 'no-aplica', motivo.trim());
    }
    async function reabrir(id) {
        const motivo = prompt('Motivo de la reapertura (obligatorio):');
        if (!motivo || !motivo.trim()) return;
        await accionEncargado(id, 'reabrir', motivo.trim());
    }
    async function accionEncargado(id, accion, motivo) {
        try {
            const r = await fetch(`/api/tareas?accion=${accion}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Auth-Token': authToken,
                    'X-Device-Id': deviceId,
                },
                body: JSON.stringify({ instancia_id: id, empleado: empleadoSel, motivo, device_id: deviceId }),
            });
            const data = await r.json().catch(() => ({}));
            if (!r.ok) { aviso(data.error || 'No se pudo aplicar el cambio', 'error', 6000); return; }
            aviso('✓ Hecho', 'ok');
            await cargarTareas();
        } catch { aviso('Error de conexión', 'error'); }
    }

    // ── Init ──────────────────────────────────────────────────
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            tab.classList.add('active');
            filtro = tab.dataset.filtro;
            render();
        });
    });

    document.addEventListener('DOMContentLoaded', async () => {
        if (!centro) { location.href = '/'; return; }
        $('centroChip').textContent = centro;

        // Si venimos del fichaje con el nombre puesto, lo preseleccionamos.
        const empParam = params.get('empleado');
        await cargarEmpleados();
        await cargarTareas();

        if (empParam) {
            const idx = empleados.findIndex(e => e.nombre === empParam);
            if (idx >= 0) {
                const btn = document.querySelectorAll('.btn-emp')[idx];
                if (btn) seleccionar(empleados[idx], btn);
            }
        }
        setInterval(cargarTareas, 60000);
        if (typeof lucide !== 'undefined') lucide.createIcons();
    });
})();
</script>
    <!-- Cámara propia: sin selector, no hay galería que elegir -->
    <div class="cam-modal" id="camModal" role="dialog" aria-modal="true" aria-label="Hacer foto">
        <video id="camVideo" playsinline muted autoplay></video>
        <div class="cam-acciones">
            <button type="button" class="cam-cancelar" id="camCancelar">Cancelar</button>
            <button type="button" class="cam-disparar" id="camDisparar">Hacer foto</button>
        </div>
    </div>
<script src="sw-update.js"></script>
</body>
</html>
